; PlatformIO Project Configuration File
;
; E-Paper Display Controller
; ESP32-based e-paper controller with API support
;
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
; Pinned for reproducible builds (Arduino core 2.0.17). For Arduino core 3.x
; switch to the community pioarduino platform:
; https://github.com/pioarduino/platform-espressif32
platform = espressif32 @ 6.12.0
framework = arduino
board = esp-wrover-kit
monitor_speed = 115200

; Build configuration
build_flags =
    -D LED_BUILTIN=2
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Increase stack size for async operations
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; Library dependencies
; (mathieucarbou/ESPAsyncWebServer is archived, development moved to ESP32Async)
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.3
lib_compat_mode = strict
lib_ldf_mode = chain

; Upload settings
upload_speed = 921600

; Monitor settings
monitor_filters = 
    esp32_exception_decoder
    time
