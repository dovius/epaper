; PlatformIO Project Configuration File
;
; E-Paper Display Controller
; ESP32-based e-paper controller with API support
;
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32
framework = arduino
board = esp-wrover-kit
monitor_speed = 115200

; Build configuration
build_flags =
    -D LED_BUILTIN=2
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Increase stack size for async operations
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; Library dependencies
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.4.5
    bblanchon/ArduinoJson @ ^7.2.1

; Upload settings
upload_speed = 921600

; Monitor settings
monitor_filters = 
    esp32_exception_decoder
    time
