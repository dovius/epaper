<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Paper Scene Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-hover: #1a1a25;
            --bg-input: #08080c;
            --accent: #22d3ee;
            --accent-dim: #0891b2;
            --accent-glow: rgba(34, 211, 238, 0.15);
            --success: #4ade80;
            --error: #f87171;
            --warning: #fbbf24;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --text-muted: #475569;
            --border: #1e293b;
            --border-bright: #334155;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 0% 0%, rgba(34, 211, 238, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
        }
        
        /* Header */
        .header {
            background: linear-gradient(180deg, var(--bg-card), transparent);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px var(--accent));
        }
        
        .logo h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.offline { background: var(--error); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
        }
        
        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; }
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--bg-hover), transparent);
        }
        
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .card-body { padding: 1rem 1.25rem; }
        
        /* Scene List */
        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .scene-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .scene-item:hover {
            border-color: var(--border-bright);
            background: var(--bg-hover);
        }
        
        .scene-item.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        
        .scene-item.disabled {
            opacity: 0.5;
        }
        
        .scene-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }
        
        .scene-info { flex: 1; }
        
        .scene-name {
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .scene-desc {
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        
        .scene-actions {
            display: flex;
            gap: 6px;
        }
        
        .scene-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .scene-badge.current {
            background: var(--accent);
            color: var(--bg);
        }
        
        .scene-badge.error {
            background: var(--error);
            color: #fff;
        }
        
        /* Preview */
        .preview-container {
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
        }
        
        .preview-image {
            max-width: 100%;
            border-radius: 4px;
            image-rendering: pixelated;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .preview-placeholder {
            text-align: center;
            color: var(--text-dim);
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-card);
            color: var(--text);
            font-family: inherit;
        }
        
        .btn:hover:not(:disabled) {
            border-color: var(--border-bright);
            background: var(--bg-hover);
        }
        
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dim);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 1.1rem;
        }
        
        /* Rotation Controls */
        .rotation-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem;
            background: var(--bg-input);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .rotation-toggle {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--border);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .rotation-toggle.active {
            background: var(--accent);
        }
        
        .rotation-toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .rotation-toggle.active::after {
            transform: translateX(22px);
        }
        
        .rotation-info {
            flex: 1;
        }
        
        .rotation-label {
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .rotation-status {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .interval-input {
            width: 70px;
            padding: 6px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .interval-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Settings Panel */
        .settings-panel {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 1rem;
            overflow: hidden;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        
        .settings-header:hover {
            background: var(--bg-hover);
        }
        
        .settings-content {
            padding: 16px;
            display: none;
        }
        
        .settings-content.open {
            display: block;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        
        input[type="text"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
        
        /* Device Info */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .device-item {
            background: var(--bg-input);
            padding: 10px 12px;
            border-radius: 6px;
        }
        
        .device-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .device-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
        }
        
        /* Notifications */
        .notif-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .notif-input {
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            resize: none;
        }
        
        .notif-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-input);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .tab {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-dim);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .tab.active {
            background: var(--bg-card);
            color: var(--accent);
        }
        
        .tab:hover:not(.active) {
            color: var(--text);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            font-size: 0.9rem;
        }
        
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--error); }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Log */
        .log {
            background: var(--bg-input);
            border-radius: 6px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-muted); }
        .log-ok { color: var(--success); }
        .log-error { color: var(--error); }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        
        .modal-overlay.open .modal {
            transform: scale(1);
        }
        
        .modal-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        
        .modal-close:hover { color: var(--text); }
        
        .modal-body { padding: 1.25rem; }
        
        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">📺</span>
            <h1>E-Paper Scene Manager</h1>
        </div>
        <div class="header-actions">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="grid">
            <!-- Main Content -->
            <div class="main-content">
                <!-- Rotation Controls -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body">
                        <div class="rotation-controls">
                            <div class="rotation-toggle" id="rotationToggle" onclick="toggleRotation()"></div>
                            <div class="rotation-info">
                                <div class="rotation-label">Auto Rotation</div>
                                <div class="rotation-status" id="rotationStatus">Loading...</div>
                            </div>
                            <span style="color: var(--text-dim); font-size: 0.85rem;">Interval:</span>
                            <input type="number" class="interval-input" id="intervalInput" value="60" min="10" max="3600" onchange="updateInterval()">
                            <span style="color: var(--text-dim); font-size: 0.85rem;">sec</span>
                        </div>
                        <div class="controls">
                            <button class="btn btn-icon" onclick="prevScene()" title="Previous">◀</button>
                            <button class="btn btn-primary" onclick="refreshDisplay()">
                                🔄 Refresh Now
                            </button>
                            <button class="btn btn-icon" onclick="nextScene()" title="Next">▶</button>
                        </div>
                    </div>
                </div>
                
                <!-- Scene List -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>🎬</span>
                            Scenes
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="scene-list" id="sceneList">
                            <!-- Scenes will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- Notifications -->
                <div class="card" style="margin-top: 1.5rem;">
                    <div class="card-header">
                        <div class="card-title">
                            <span>🔔</span>
                            Send Notification
                        </div>
                        <button class="btn btn-sm" onclick="clearNotifications()">Clear All</button>
                    </div>
                    <div class="card-body">
                        <div class="notif-form">
                            <input type="text" id="notifTitle" placeholder="Title" class="notif-input">
                            <textarea id="notifMessage" placeholder="Message..." class="notif-input" rows="2"></textarea>
                            <select id="notifPriority" class="notif-input">
                                <option value="low">Low Priority</option>
                                <option value="normal" selected>Normal Priority</option>
                                <option value="high">High Priority</option>
                            </select>
                            <button class="btn btn-primary" onclick="sendNotification()">Send Notification</button>
                        </div>
                    </div>
                </div>
                
                <!-- Log -->
                <div class="card" style="margin-top: 1.5rem;">
                    <div class="card-header">
                        <div class="card-title">
                            <span>📜</span>
                            Activity Log
                        </div>
                        <button class="btn btn-sm" onclick="clearLog()">Clear</button>
                    </div>
                    <div class="card-body">
                        <div class="log" id="log">
                            <div class="log-entry">
                                <span class="log-time">[--:--:--]</span> Ready
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Preview -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>👁️</span>
                            Live Preview
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="preview-container">
                            <img src="" alt="Preview" class="preview-image" id="previewImage" style="display: none;">
                            <div class="preview-placeholder" id="previewPlaceholder">
                                <p>No preview</p>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 10px;">
                            <span id="currentSceneName" style="color: var(--accent); font-weight: 500;">--</span>
                        </div>
                    </div>
                </div>
                
                <!-- Device Settings -->
                <div class="card" style="margin-top: 1rem;">
                    <div class="card-header">
                        <div class="card-title">
                            <span>⚙️</span>
                            Device
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>ESP32 IP Address</label>
                            <input type="text" id="deviceIp" value="{{ device_ip }}" placeholder="192.168.1.100">
                        </div>
                        <button class="btn" style="width: 100%;" onclick="saveDeviceConfig()">
                            Save & Test
                        </button>
                        
                        <div class="device-grid" style="margin-top: 1rem;">
                            <div class="device-item">
                                <div class="device-label">IP</div>
                                <div class="device-value" id="infoIp">-</div>
                            </div>
                            <div class="device-item">
                                <div class="device-label">Signal</div>
                                <div class="device-value" id="infoRssi">-</div>
                            </div>
                            <div class="device-item">
                                <div class="device-label">Uptime</div>
                                <div class="device-value" id="infoUptime">-</div>
                            </div>
                            <div class="device-item">
                                <div class="device-label">RAM</div>
                                <div class="device-value" id="infoRam">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scene Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modalIcon">⚙️</span>
                    <span id="modalTitle">Scene Settings</span>
                </div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Settings form will be generated here -->
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSceneSettings()">Save Settings</button>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        // State
        let scenes = [];
        let currentSceneId = null;
        let editingSceneId = null;
        
        // API
        async function api(endpoint, options = {}) {
            const res = await fetch('/api/' + endpoint, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Request failed');
            return data;
        }
        
        // Logging
        function log(message, type = 'ok') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const cls = type === 'error' ? 'log-error' : 'log-ok';
            logEl.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> <span class="${cls}">${message}</span></div>` + logEl.innerHTML;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Toast
        function toast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = `<span>${type === 'success' ? '✓' : '✗'}</span> ${message}`;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        
        // Preview
        function showPreview(url) {
            const img = document.getElementById('previewImage');
            const placeholder = document.getElementById('previewPlaceholder');
            img.src = url;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        }
        
        function refreshPreview() {
            showPreview('/api/last-image?_=' + Date.now());
        }
        
        // Scene List
        function renderSceneList() {
            const container = document.getElementById('sceneList');
            container.innerHTML = scenes.map(scene => `
                <div class="scene-item ${scene.id === currentSceneId ? 'active' : ''} ${!scene.config.enabled ? 'disabled' : ''}"
                     onclick="showScene('${scene.id}')">
                    <div class="scene-icon">${scene.icon}</div>
                    <div class="scene-info">
                        <div class="scene-name">${scene.name}</div>
                        <div class="scene-desc">${scene.description}</div>
                    </div>
                    <div class="scene-actions">
                        ${scene.id === currentSceneId ? '<span class="scene-badge current">Active</span>' : ''}
                        ${scene.last_error ? '<span class="scene-badge error">Error</span>' : ''}
                        <button class="btn btn-sm btn-icon" onclick="event.stopPropagation(); openSettings('${scene.id}')" title="Settings">⚙️</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Load scenes
        async function loadScenes() {
            try {
                const data = await api('scenes');
                scenes = data.scenes;
                currentSceneId = data.manager.current_scene;
                
                // Update rotation controls
                const toggle = document.getElementById('rotationToggle');
                toggle.classList.toggle('active', data.manager.rotation_enabled);
                document.getElementById('intervalInput').value = data.manager.rotation_interval;
                document.getElementById('rotationStatus').textContent = 
                    data.manager.rotation_enabled ? `Every ${data.manager.rotation_interval}s` : 'Paused';
                
                // Update current scene name
                const currentScene = scenes.find(s => s.id === currentSceneId);
                document.getElementById('currentSceneName').textContent = 
                    currentScene ? `${currentScene.icon} ${currentScene.name}` : '--';
                
                renderSceneList();
            } catch (e) {
                log('Failed to load scenes: ' + e.message, 'error');
            }
        }
        
        // Show scene
        async function showScene(sceneId) {
            try {
                await api(`scenes/${sceneId}/show`, { method: 'POST' });
                currentSceneId = sceneId;
                renderSceneList();
                refreshPreview();
                
                const scene = scenes.find(s => s.id === sceneId);
                document.getElementById('currentSceneName').textContent = 
                    scene ? `${scene.icon} ${scene.name}` : '--';
                
                toast(`Showing ${scene?.name || sceneId}`);
                log(`Displayed scene: ${scene?.name || sceneId}`);
            } catch (e) {
                toast(e.message, 'error');
                log('Show scene failed: ' + e.message, 'error');
            }
        }
        
        // Rotation
        async function toggleRotation() {
            const toggle = document.getElementById('rotationToggle');
            const isActive = toggle.classList.contains('active');
            
            try {
                if (isActive) {
                    await api('rotation/stop', { method: 'POST' });
                    toggle.classList.remove('active');
                    document.getElementById('rotationStatus').textContent = 'Paused';
                    log('Rotation stopped');
                } else {
                    await api('rotation/start', { method: 'POST' });
                    toggle.classList.add('active');
                    const interval = document.getElementById('intervalInput').value;
                    document.getElementById('rotationStatus').textContent = `Every ${interval}s`;
                    log('Rotation started');
                }
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        async function updateInterval() {
            const interval = parseInt(document.getElementById('intervalInput').value);
            try {
                await api(`rotation/interval?interval=${interval}`, { method: 'POST' });
                document.getElementById('rotationStatus').textContent = `Every ${interval}s`;
                log(`Rotation interval set to ${interval}s`);
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        async function nextScene() {
            try {
                const data = await api('rotation/next', { method: 'POST' });
                currentSceneId = data.scene;
                await loadScenes();
                refreshPreview();
                log('Next scene: ' + data.scene);
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        async function prevScene() {
            try {
                const data = await api('rotation/prev', { method: 'POST' });
                currentSceneId = data.scene;
                await loadScenes();
                refreshPreview();
                log('Previous scene: ' + data.scene);
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        async function refreshDisplay() {
            try {
                await api('display/refresh', { method: 'POST' });
                refreshPreview();
                toast('Display refreshed');
                log('Display refreshed');
            } catch (e) {
                toast(e.message, 'error');
                log('Refresh failed: ' + e.message, 'error');
            }
        }
        
        // Settings Modal
        function openSettings(sceneId) {
            editingSceneId = sceneId;
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;
            
            document.getElementById('modalIcon').textContent = scene.icon;
            document.getElementById('modalTitle').textContent = scene.name + ' Settings';
            
            // Generate settings form
            let html = `
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="setting-enabled" ${scene.config.enabled ? 'checked' : ''}>
                        <label for="setting-enabled" style="margin: 0;">Enabled in rotation</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Update Interval (seconds)</label>
                    <input type="number" id="setting-interval" value="${scene.config.interval}" min="10" max="3600">
                </div>
            `;
            
            // Add scene-specific settings
            if (scene.settings_schema && scene.settings_schema.length > 0) {
                html += '<hr style="border: none; border-top: 1px solid var(--border); margin: 1rem 0;">';
                html += '<div style="font-weight: 500; margin-bottom: 1rem;">Scene Settings</div>';
                
                for (const setting of scene.settings_schema) {
                    const value = scene.config.settings[setting.key] ?? setting.default;
                    
                    if (setting.type === 'checkbox') {
                        html += `
                            <div class="form-group">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="custom-${setting.key}" ${value ? 'checked' : ''}>
                                    <label for="custom-${setting.key}" style="margin: 0;">${setting.label}</label>
                                </div>
                            </div>
                        `;
                    } else if (setting.type === 'select') {
                        html += `
                            <div class="form-group">
                                <label>${setting.label}</label>
                                <select id="custom-${setting.key}">
                                    ${setting.options.map(opt => 
                                        `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`
                                    ).join('')}
                                </select>
                            </div>
                        `;
                    } else if (setting.type === 'password') {
                        html += `
                            <div class="form-group">
                                <label>${setting.label}</label>
                                <input type="password" id="custom-${setting.key}" value="${value || ''}" placeholder="${setting.description || ''}">
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="form-group">
                                <label>${setting.label}</label>
                                <input type="${setting.type === 'number' ? 'number' : 'text'}" 
                                       id="custom-${setting.key}" 
                                       value="${value || ''}"
                                       placeholder="${setting.description || ''}">
                            </div>
                        `;
                    }
                }
            }
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('settingsModal').classList.add('open');
        }
        
        function closeModal() {
            document.getElementById('settingsModal').classList.remove('open');
            editingSceneId = null;
        }
        
        async function saveSceneSettings() {
            if (!editingSceneId) return;
            
            const scene = scenes.find(s => s.id === editingSceneId);
            const config = {
                enabled: document.getElementById('setting-enabled').checked,
                interval: parseInt(document.getElementById('setting-interval').value),
                settings: {}
            };
            
            // Collect custom settings
            if (scene.settings_schema) {
                for (const setting of scene.settings_schema) {
                    const el = document.getElementById('custom-' + setting.key);
                    if (el) {
                        if (setting.type === 'checkbox') {
                            config.settings[setting.key] = el.checked;
                        } else if (setting.type === 'number') {
                            config.settings[setting.key] = parseInt(el.value);
                        } else {
                            config.settings[setting.key] = el.value;
                        }
                    }
                }
            }
            
            try {
                await api(`scenes/${editingSceneId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                
                toast('Settings saved');
                log(`Updated ${scene.name} settings`);
                closeModal();
                await loadScenes();
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        // Notifications
        async function sendNotification() {
            const title = document.getElementById('notifTitle').value;
            const message = document.getElementById('notifMessage').value;
            const priority = document.getElementById('notifPriority').value;
            
            if (!title || !message) {
                toast('Please fill in title and message', 'error');
                return;
            }
            
            try {
                await api('notifications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, message, priority })
                });
                
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifMessage').value = '';
                
                toast('Notification added');
                log(`Notification: ${title}`);
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        async function clearNotifications() {
            try {
                await api('notifications', { method: 'DELETE' });
                toast('Notifications cleared');
                log('Cleared all notifications');
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        // Device
        async function checkDeviceStatus() {
            try {
                const data = await api('device/status');
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                
                if (data.status === 'online') {
                    dot.className = 'status-dot online';
                    text.textContent = 'Online';
                    
                    const device = data.device;
                    document.getElementById('infoIp').textContent = device.ip || '-';
                    document.getElementById('infoRssi').textContent = (device.rssi || '-') + ' dBm';
                    document.getElementById('infoUptime').textContent = device.uptime || '-';
                    document.getElementById('infoRam').textContent = ((device.freeHeap || 0) / 1024).toFixed(1) + ' KB';
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }
        
        async function saveDeviceConfig() {
            const ip = document.getElementById('deviceIp').value;
            try {
                await api('device/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                toast('Device config saved');
                log('Device IP: ' + ip);
                checkDeviceStatus();
            } catch (e) {
                toast(e.message, 'error');
            }
        }
        
        // Initialize
        async function init() {
            await loadScenes();
            await checkDeviceStatus();
            refreshPreview();
            
            // Periodic updates
            setInterval(checkDeviceStatus, 10000);
            setInterval(loadScenes, 30000);
            setInterval(refreshPreview, 60000);
        }
        
        init();
    </script>
</body>
</html>
